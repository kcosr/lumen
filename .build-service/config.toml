[connection]
endpoint = "http://pc:8882"
local_fallback = false

[sources]
include = ["src/**", "Cargo.toml", "Cargo.lock"]
exclude = []

[artifacts]
include = ["src/**", "Cargo.toml", "target/release/lumen", "target/release/lumen-cli"]
exclude = []

[request]
timeout_sec = 900

[request.env]
RUSTUP_HOME = "/opt/rust"
CARGO_HOME = "/opt/rust"

[output]                                                                                                                                                                    
stdout_max_lines = 20
stderr_max_lines = 20
stdout_tail_lines = 5
stderr_tail_lines = 5
